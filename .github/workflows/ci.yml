name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and CTest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

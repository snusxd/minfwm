name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow:
    name: AI workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_ai_*.py'
      - run: python3 tools/ai_profile.py validate
      - run: python3 tools/ai_workflow.py validate

  macos:
    name: macOS build and CTest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

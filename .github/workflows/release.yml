name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS App DMGs
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          major="$(tr -d '[:space:]' < VERSION_MAJOR)"
          if [[ ! "$major" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION_MAJOR must contain one non-negative integer" >&2
            exit 1
          fi

          latest=-1
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v${major}\.([0-9]+)$ ]]; then
              count="${BASH_REMATCH[1]}"
              count_num=$((10#$count))
              if (( count_num > latest )); then latest="$count_num"; fi
            fi
          done < <(git tag --list "v${major}.*")

          tag="v${major}.$((latest + 1))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Build and test Apple Silicon (arm64)
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cmake -S . -B build-arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DMINFWM_BUILD_VERSION="$RELEASE_TAG"
          cmake --build build-arm64 --parallel
          ctest --test-dir build-arm64 --output-on-failure

      - name: Build Intel (x86_64)
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cmake -S . -B build-x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DMINFWM_BUILD_VERSION="$RELEASE_TAG"
          cmake --build build-x86_64 --parallel --target minfwm

      - name: Package DMGs (Apple Silicon & Intel)
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release

          for arch in arm64 x86_64; do
            stage="$PWD/release/dmg-${arch}"
            rm -rf "$stage"
            mkdir -p "$stage"

            ARCH="$arch" \
            APP_VERSION="$RELEASE_TAG" \
            MINFWM_BIN="$PWD/build-${arch}/minfwm" \
            OUT_APP="$stage/minfWM.app" \
            bash app/Scripts/package_app.sh

            test -d "$stage/minfWM.app"
            test -x "$stage/minfWM.app/Contents/MacOS/Minfwm"
            test -x "$stage/minfWM.app/Contents/Resources/minfwm"

            ln -s /Applications "$stage/Applications"

            hdiutil create \
              -volname "minfWM" \
              -srcfolder "$stage" \
              -ov \
              -format UDZO \
              "release/minfWM-${arch}.dmg"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/minfWM-arm64.dmg \
            release/minfWM-x86_64.dmg \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
